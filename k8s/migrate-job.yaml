apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate
  namespace: llm-logger
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U llm -d llmlogger; do
                echo "waiting for postgres...";
                sleep 2;
              done
      containers:
        - name: migrate
          # The web image is the Next.js standalone bundle and has no Prisma
          # CLI. Use the worker image which still has node_modules + the CLI.
          image: llm-logger-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: app-config
