services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: llm
      POSTGRES_PASSWORD: llm
      POSTGRES_DB: llmlogger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm -d llmlogger"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: web-runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://llm:llm@postgres:5432/llmlogger
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NODE_ENV: production
    ports:
      - "3000:3000"
    # The standalone bundle has no Prisma CLI, so we can't `migrate deploy`
    # from this container. The k8s Job handles migrations there; for compose
    # we rely on the worker container (which keeps the full node_modules and
    # CLI) to run migrations on startup before draining.
    command: ["node", "server.js"]

  worker:
    build:
      context: .
      target: worker-runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://llm:llm@postgres:5432/llmlogger
      REDIS_URL: redis://redis:6379
    # Run migrations on worker boot (worker image has the Prisma CLI).
    command: sh -c "npx prisma migrate deploy && npm run worker"

volumes:
  pgdata:
