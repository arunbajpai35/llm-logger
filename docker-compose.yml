services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: llm
      POSTGRES_PASSWORD: llm
      POSTGRES_DB: llmlogger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm -d llmlogger"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot Prisma migration. Both app and worker gate on this so they
  # never serve traffic / drain the queue against a stale schema. Mirrors
  # the k8s `prisma-migrate` Job (k8s/migrate-job.yaml).
  migrate:
    build:
      context: .
      target: worker-runner
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://llm:llm@postgres:5432/llmlogger
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  app:
    build:
      context: .
      target: web-runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://llm:llm@postgres:5432/llmlogger
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NODE_ENV: production
    ports:
      - "3000:3000"
    command: ["node", "server.js"]

  worker:
    build:
      context: .
      target: worker-runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://llm:llm@postgres:5432/llmlogger
      REDIS_URL: redis://redis:6379
    command: ["npm", "run", "worker"]

volumes:
  pgdata:
